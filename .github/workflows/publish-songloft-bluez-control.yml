name: Publish Songloft BlueZ Control to Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: Source tag in dlaq/songloft-bluez-control, for example v1.0.0
        required: true
        default: v1.0.0
        type: string
      publish_latest:
        description: Also publish the latest tag
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-songloft-bluez-control-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = '${{ inputs.version }}'
          if ($Version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid version: $Version"
          }
          "tag=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "plain=$($Version.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          repository: dlaq/songloft-bluez-control
          ref: ${{ steps.version.outputs.tag }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/songloft-bluez-control
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=${{ steps.version.outputs.plain }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/dlaq/songloft-bluez-control
            org.opencontainers.image.title=Songloft BlueZ Control Companion
            org.opencontainers.image.description=BlueZ D-Bus companion for the Songloft Bluetooth speaker plugin
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: companion
          file: companion/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=songloft-bluez-control
          cache-to: type=gha,mode=max,scope=songloft-bluez-control

      - name: Verify published manifest
        shell: pwsh
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/songloft-bluez-control:${{ steps.version.outputs.plain }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker buildx imagetools inspect $env:IMAGE
